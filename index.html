<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080e">
<title>Murmuration — Boids</title>
<style>
  :root {
    --ink: #06080e;
    --panel: rgba(10, 14, 22, 0.82);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e7eef6;
    --muted: #8d99ab;
    --accent: #7ee0c6;
    --amber: #f0c27a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #c {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
    z-index: 0;
  }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.5) 100%);
  }
  #panel {
    position: fixed;
    z-index: 2;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    padding: 14px 14px 12px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid rgba(126, 224, 198, 0.18);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    touch-action: auto;
  }
  header.top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .mark {
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 650;
  }
  .mark::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 8px;
    border-radius: 1px;
    background: var(--accent);
    transform: rotate(45deg);
    box-shadow: 0 0 10px var(--accent);
  }
  .sub {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.01em;
  }
  .stats {
    margin-left: auto;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.35;
  }
  .stats b { color: var(--text); font-weight: 600; }
  .actions { display: flex; gap: 6px; }
  button {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 12px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    min-height: 36px;
  }
  button:active { background: rgba(126, 224, 198, 0.16); }
  #controls { display: grid; gap: 2px; }
  #panel.collapsed #controls { display: none; }
  #panel.collapsed header.top { margin-bottom: 0; }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0 12px;
    padding: 4px 0;
  }
  .name { font-size: 13px; letter-spacing: 0.02em; }
  .val {
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    font-size: 13px;
    min-width: 3.2em;
    text-align: right;
  }
  input[type="range"] {
    grid-column: 1 / -1;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    margin: 0;
    background: transparent;
    touch-action: none;
  }
  input[type="range"]:focus { outline: none; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 99px;
    background: linear-gradient(90deg, rgba(255,255,255,0.14), var(--accent));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    margin-top: -10px;
    border-radius: 50%;
    background: #f6fffb;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 4px rgba(126, 224, 198, 0.16);
  }
  input[type="range"]::-moz-range-track {
    height: 3px;
    border-radius: 99px;
    background: linear-gradient(90deg, rgba(255,255,255,0.14), var(--accent));
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #f6fffb;
    border: 2px solid var(--accent);
  }
  @media (min-width: 840px) {
    #panel {
      left: auto;
      right: 16px;
      top: 16px;
      bottom: auto;
      width: 320px;
    }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<aside id="panel">
  <header class="top">
    <div>
      <div class="mark">Murmuration</div>
      <div class="sub">Touch or hover to scatter the flock</div>
    </div>
    <div class="stats"><div><b id="hud-n">160</b> boids</div><div><b id="hud-fps">—</b> fps</div></div>
  </header>
  <div class="actions" style="margin-bottom:10px">
    <button id="scatter" type="button">Scatter</button>
    <button id="fold" type="button">Hide</button>
  </div>
  <div id="controls">
    <label class="row"><span class="name">Separation</span><span class="val" id="v-sep">1.60</span>
      <input id="sep" type="range" min="0" max="3" step="0.01" value="1.6"></label>
    <label class="row"><span class="name">Alignment</span><span class="val" id="v-ali">1.15</span>
      <input id="ali" type="range" min="0" max="3" step="0.01" value="1.15"></label>
    <label class="row"><span class="name">Cohesion</span><span class="val" id="v-coh">0.95</span>
      <input id="coh" type="range" min="0" max="3" step="0.01" value="0.95"></label>
    <label class="row"><span class="name">Population</span><span class="val" id="v-pop">160</span>
      <input id="pop" type="range" min="40" max="480" step="1" value="160"></label>
    <label class="row"><span class="name">Speed</span><span class="val" id="v-spd">1.50</span>
      <input id="spd" type="range" min="0.4" max="3.2" step="0.01" value="1.5"></label>
  </div>
</aside>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const MAX = 480;
  const CELL = 96;
  const PERCEPTION = 90;
  const SEP_DIST = 32;
  const BASE_SPEED = 100;

  const px = new Float32Array(MAX);
  const py = new Float32Array(MAX);
  const vx = new Float32Array(MAX);
  const vy = new Float32Array(MAX);
  const hue = new Float32Array(MAX);
  const next = new Int32Array(MAX);
  const seen = new Int32Array(MAX);
  let head = new Int32Array(4);
  let gridCols = 1, gridRows = 1;
  let stamp = 1;

  const params = {
    sep: 1.6,
    ali: 1.15,
    coh: 0.95,
    speed: 1.5,
    count: 160
  };

  let w = 1, h = 1, dpr = 1, count = 0;
  const pointer = { x: 0, y: 0, inside: false, pressed: false };
  const waves = [];
  const steer = { x: 0, y: 0 };

  const hudN = document.getElementById("hud-n");
  const hudFps = document.getElementById("hud-fps");
  const panel = document.getElementById("panel");

  function maxSpeed() { return BASE_SPEED * params.speed; }
  function maxForce() { return 280 * Math.max(0.55, params.speed); }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(1, window.innerWidth);
    h = Math.max(1, window.innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#06080e";
    ctx.fillRect(0, 0, w, h);
    const cols = Math.max(1, Math.ceil(w / CELL));
    const rows = Math.max(1, Math.ceil(h / CELL));
    if (cols !== gridCols || rows !== gridRows) {
      gridCols = cols;
      gridRows = rows;
      head = new Int32Array(cols * rows);
    }
  }

  function spawn(i, clustered) {
    if (clustered) {
      const gx = (0.22 + (i % 4) * 0.18) * w;
      const gy = (0.28 + ((i * 3) % 4) * 0.14) * h;
      px[i] = gx + (Math.random() - 0.5) * 80;
      py[i] = gy + (Math.random() - 0.5) * 80;
    } else {
      px[i] = Math.random() * w;
      py[i] = Math.random() * h;
    }
    const ang = Math.random() * Math.PI * 2;
    const s = maxSpeed() * (0.55 + Math.random() * 0.45);
    vx[i] = Math.cos(ang) * s;
    vy[i] = Math.sin(ang) * s;
    hue[i] = Math.random() < 0.14 ? 32 + Math.random() * 18 : 158 + Math.random() * 32;
  }

  function setCount(n) {
    n = Math.max(0, Math.min(MAX, n | 0));
    if (w < 2) resize();
    for (let i = count; i < n; i++) spawn(i, count === 0);
    count = n;
    params.count = n;
    hudN.textContent = String(n);
  }

  function wrapAll() {
    for (let i = 0; i < count; i++) {
      if (px[i] < 0) px[i] += w;
      else if (px[i] >= w) px[i] -= w;
      if (py[i] < 0) py[i] += h;
      else if (py[i] >= h) py[i] -= h;
    }
  }

  function buildGrid() {
    head.fill(-1);
    for (let i = 0; i < count; i++) {
      let cx = Math.floor(px[i] / CELL);
      let cy = Math.floor(py[i] / CELL);
      if (cx < 0) cx = 0; else if (cx >= gridCols) cx = gridCols - 1;
      if (cy < 0) cy = 0; else if (cy >= gridRows) cy = gridRows - 1;
      const c = cy * gridCols + cx;
      next[i] = head[c];
      head[c] = i;
    }
  }

  function steerToward(dx, dy, ivx, ivy, mSpeed, mForce) {
    const m = Math.hypot(dx, dy);
    if (m < 1e-5) { steer.x = 0; steer.y = 0; return; }
    let sx = (dx / m) * mSpeed - ivx;
    let sy = (dy / m) * mSpeed - ivy;
    const sm = Math.hypot(sx, sy);
    if (sm > mForce) {
      const k = mForce / sm;
      sx *= k; sy *= k;
    }
    steer.x = sx; steer.y = sy;
  }

  function step(dt) {
    wrapAll();
    buildGrid();
    const mSpeed = maxSpeed();
    const mForce = maxForce();
    const avoidR = 130;
    const avoidR2 = avoidR * avoidR;
    const perc2 = PERCEPTION * PERCEPTION;
    const sep2 = SEP_DIST * SEP_DIST;

    for (let i = 0; i < count; i++) {
      stamp++;
      if (stamp > 2e9) { seen.fill(0); stamp = 1; }
      let sepX = 0, sepY = 0;
      let aliX = 0, aliY = 0, aliN = 0;
      let cohX = 0, cohY = 0, cohN = 0;
      const cxi = Math.floor(px[i] / CELL);
      const cyi = Math.floor(py[i] / CELL);
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          let cx = cxi + ox;
          let cy = cyi + oy;
          cx = ((cx % gridCols) + gridCols) % gridCols;
          cy = ((cy % gridRows) + gridRows) % gridRows;
          let j = head[cy * gridCols + cx];
          while (j !== -1) {
            if (j !== i && seen[j] !== stamp) {
              seen[j] = stamp;
              let dx = px[j] - px[i];
              let dy = py[j] - py[i];
              if (dx > w * 0.5) dx -= w;
              else if (dx < -w * 0.5) dx += w;
              if (dy > h * 0.5) dy -= h;
              else if (dy < -h * 0.5) dy += h;
              const d2 = dx * dx + dy * dy;
              if (d2 > 0 && d2 < perc2) {
                aliX += vx[j]; aliY += vy[j]; aliN++;
                cohX += dx; cohY += dy; cohN++;
                if (d2 < sep2) {
                  const d = Math.sqrt(d2);
                  const inv = 1 / Math.max(d, 0.8);
                  sepX -= dx * inv * inv;
                  sepY -= dy * inv * inv;
                }
              }
            }
            j = next[j];
          }
        }
      }

      let ax = 0, ay = 0;
      if (sepX !== 0 || sepY !== 0) {
        steerToward(sepX, sepY, vx[i], vy[i], mSpeed, mForce);
        ax += steer.x * params.sep;
        ay += steer.y * params.sep;
      }
      if (aliN > 0) {
        steerToward(aliX, aliY, vx[i], vy[i], mSpeed, mForce);
        ax += steer.x * params.ali;
        ay += steer.y * params.ali;
      }
      if (cohN > 0) {
        steerToward(cohX, cohY, vx[i], vy[i], mSpeed, mForce);
        ax += steer.x * params.coh;
        ay += steer.y * params.coh;
      }

      if (pointer.inside) {
        const dx = px[i] - pointer.x;
        const dy = py[i] - pointer.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < avoidR2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const fall = 1 - d / avoidR;
          const boost = pointer.pressed ? 2.4 : 1;
          steerToward(dx, dy, vx[i], vy[i], mSpeed, mForce * 1.7);
          ax += steer.x * (1.3 + fall * 2.8) * boost;
          ay += steer.y * (1.3 + fall * 2.8) * boost;
        }
      }

      vx[i] += ax * dt;
      vy[i] += ay * dt;
      let sp = Math.hypot(vx[i], vy[i]);
      const minS = mSpeed * 0.35;
      if (sp > mSpeed) {
        const k = mSpeed / sp;
        vx[i] *= k; vy[i] *= k;
      } else if (sp < minS && sp > 0.001) {
        const k = minS / sp;
        vx[i] *= k; vy[i] *= k;
      }
      px[i] += vx[i] * dt;
      py[i] += vy[i] * dt;
    }

    for (let wi = waves.length - 1; wi >= 0; wi--) {
      const wave = waves[wi];
      wave.r += 460 * dt;
      wave.life -= dt * 1.35;
      if (wave.life <= 0) { waves.splice(wi, 1); continue; }
      const inner = wave.r - 42;
      for (let i = 0; i < count; i++) {
        const dx = px[i] - wave.x;
        const dy = py[i] - wave.y;
        const d = Math.hypot(dx, dy);
        if (d < wave.r && d > inner && d > 1) {
          const push = 260 * wave.life;
          vx[i] += (dx / d) * push * dt * 8;
          vy[i] += (dy / d) * push * dt * 8;
        }
      }
    }
  }

  function drawBoid(x, y, ang, color, scale) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.scale(scale, scale);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(9, 0);
    ctx.lineTo(-6.2, 3.5);
    ctx.lineTo(-3.1, 0);
    ctx.lineTo(-6.2, -3.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-3, 0);
    ctx.lineTo(-14, 0);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "rgba(6, 8, 14, 0.28)";
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < count; i++) {
      const ang = Math.atan2(vy[i], vx[i]);
      const sp = Math.hypot(vx[i], vy[i]);
      const scale = 0.82 + Math.min(sp / Math.max(maxSpeed(), 1), 1.3) * 0.4;
      const color = "hsla(" + hue[i].toFixed(1) + ", 72%, 70%, 0.95)";
      const x = px[i], y = py[i];
      drawBoid(x, y, ang, color, scale);
      if (x < 16) drawBoid(x + w, y, ang, color, scale);
      if (x > w - 16) drawBoid(x - w, y, ang, color, scale);
      if (y < 16) drawBoid(x, y + h, ang, color, scale);
      if (y > h - 16) drawBoid(x, y - h, ang, color, scale);
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (pointer.inside) {
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 130, 0, Math.PI * 2);
      ctx.strokeStyle = pointer.pressed ? "rgba(240, 194, 122, 0.55)" : "rgba(126, 224, 198, 0.28)";
      ctx.lineWidth = pointer.pressed ? 2 : 1;
      ctx.stroke();
    }
    for (let i = 0; i < waves.length; i++) {
      const wave = waves[i];
      ctx.beginPath();
      ctx.arc(wave.x, wave.y, wave.r, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(240, 194, 122, " + (wave.life * 0.5).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function burst(x, y) {
    if (waves.length > 5) waves.shift();
    waves.push({ x, y, r: 12, life: 1 });
  }

  function localFrom(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }

  canvas.addEventListener("pointerdown", (e) => {
    const p = localFrom(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.inside = true; pointer.pressed = true;
    burst(p.x, p.y);
  });
  canvas.addEventListener("pointermove", (e) => {
    const p = localFrom(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.inside = true;
  });
  canvas.addEventListener("pointerup", () => { pointer.pressed = false; });
  canvas.addEventListener("pointercancel", () => { pointer.pressed = false; pointer.inside = false; });
  canvas.addEventListener("pointerleave", () => { pointer.inside = false; pointer.pressed = false; });

  function bindSlider(id, valId, key, format) {
    const el = document.getElementById(id);
    const out = document.getElementById(valId);
    const apply = () => {
      const v = parseFloat(el.value);
      params[key] = v;
      out.textContent = format(v);
      if (key === "count") setCount(v);
    };
    el.addEventListener("input", apply);
    apply();
  }
  bindSlider("sep", "v-sep", "sep", (v) => v.toFixed(2));
  bindSlider("ali", "v-ali", "ali", (v) => v.toFixed(2));
  bindSlider("coh", "v-coh", "coh", (v) => v.toFixed(2));
  bindSlider("pop", "v-pop", "count", (v) => String(v | 0));
  bindSlider("spd", "v-spd", "speed", (v) => v.toFixed(2));

  document.getElementById("fold").addEventListener("click", () => {
    panel.classList.toggle("collapsed");
    document.getElementById("fold").textContent = panel.classList.contains("collapsed") ? "Show" : "Hide";
  });
  document.getElementById("scatter").addEventListener("click", () => {
    burst(w * 0.35, h * 0.38);
    burst(w * 0.62, h * 0.42);
    burst(w * 0.48, h * 0.58);
  });

  let last = performance.now();
  let fpsFrames = 0;
  let fpsT = last;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000) || 0.016;
    last = now;
    step(dt);
    draw();
    fpsFrames++;
    if (now - fpsT > 500) {
      hudFps.textContent = String(Math.round((fpsFrames * 1000) / (now - fpsT)));
      fpsFrames = 0;
      fpsT = now;
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  setCount(params.count);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
